name: Sync docs to dot-dev

on:
  push:
    branches: [main]
    paths: ['docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOCS_SYNC_PAT: ${{ secrets.DOCS_SYNC_PAT }}
    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          path: agent-skills
          persist-credentials: false

      - name: Verify docs sync token
        if: env.DOCS_SYNC_PAT == ''
        run: |
          echo "DOCS_SYNC_PAT is not set; configure it to enable docs sync."
          exit 1

      - name: Checkout dot-dev
        uses: actions/checkout@v4
        with:
          repository: pacaplan/codagent-dot-dev
          ref: main
          token: ${{ env.DOCS_SYNC_PAT }}
          path: dot-dev
          persist-credentials: false

      - name: Copy docs into dot-dev content dir
        run: |
          set -euo pipefail
          SRC=agent-skills/docs
          DEST="dot-dev/src/docs/content/agent-skills"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          # Published markdown, minus internal/meta pages. (The dot-dev generator
          # also skips README/AGENTS/CLAUDE, but drop them here to keep the
          # content dir clean; development.md is internal and not published.)
          cp "$SRC"/*.md "$DEST"/
          rm -f "$DEST"/development.md "$DEST"/README.md "$DEST"/AGENTS.md "$DEST"/CLAUDE.md

          # Images: copy only the ones a published page references, so unreferenced
          # assets (demo GIF, full-size diagrams) never bloat the site; downscale
          # any oversized raster that does get referenced.
          if [ -d "$SRC/images" ]; then
            mkdir -p "$DEST/images"
            for img in "$SRC"/images/*; do
              [ -f "$img" ] || continue
              base="$(basename "$img")"
              if grep -qlF "images/$base" "$DEST"/*.md 2>/dev/null; then
                cp "$img" "$DEST/images/$base"
              fi
            done
            if command -v convert >/dev/null 2>&1; then
              for img in "$DEST"/images/*.png "$DEST"/images/*.jpg "$DEST"/images/*.jpeg "$DEST"/images/*.gif; do
                [ -f "$img" ] || continue
                convert "$img" -resize '1280x1280>' "$img" || true
              done
            fi
            rmdir "$DEST/images" 2>/dev/null || true
          fi

      - name: Check for changes
        id: diff
        working-directory: dot-dev
        run: |
          git add -A src/docs/content/agent-skills
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync PR
        if: steps.diff.outputs.changed == 'true'
        working-directory: dot-dev
        env:
          GH_TOKEN: ${{ env.DOCS_SYNC_PAT }}
        run: |
          set -euo pipefail
          git config user.name "docs-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          SHORT_SHA="$(cd ../agent-skills && git rev-parse --short HEAD)"
          BRANCH="docs-sync/agent-skills-${SHORT_SHA}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "docs: sync agent-skills docs from ${SHORT_SHA}"
          git remote set-url origin "https://x-access-token:${DOCS_SYNC_PAT}@github.com/pacaplan/codagent-dot-dev.git"
          trap 'git remote set-url origin https://github.com/pacaplan/codagent-dot-dev.git' EXIT
          git push origin "$BRANCH"
          gh pr create --repo pacaplan/codagent-dot-dev \
            --title "docs: sync agent-skills docs (${SHORT_SHA})" \
            --body "Automated sync of \`docs/\` from Codagent-AI/agent-skills@${SHORT_SHA}. Merges automatically once the build check passes." \
            --base main --head "$BRANCH"
