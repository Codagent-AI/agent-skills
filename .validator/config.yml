debug_log:
  enabled: true

# Ordered list of CLI agents to try for reviews
cli:
  default_preference:
    - codex
  adapters:
    codex:
      model: gpt-6-sol
      allow_tool_use: false
      thinking_budget: medium

entry_points:
  - path: "."
    checks:
      - scratch-space-guidance:
          command: bash skills/test-flows/scripts/scratch-space_test.sh
    reviews:
      - skill-quality
